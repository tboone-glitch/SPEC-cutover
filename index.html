<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teradata to Snowflake cutover</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #111821;
    --line: #1f2a37;
    --text: #d1d9e0;
    --muted: #6b7a8c;
    --accent: #29b5e8;
    --ok: #22c55e;
    --warn: #f59e0b;
    --bad: #ef4444;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 var(--mono);
    min-height: 100vh;
  }
  .app { max-width: 1100px; margin: 0 auto; padding: 16px; }
  header {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 12px; padding: 12px 14px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px;
  }
  h1 { margin: 0; font-size: 18px; font-weight: 700; color: #fff; }
  h1::before { content: "$ "; color: var(--accent); }
  .meters { display: flex; gap: 10px; flex-wrap: wrap; }
  .meter {
    border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; min-width: 120px;
  }
  .meter .label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .meter .value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; color: #fff; }
  .meter.low .value { color: var(--bad); }
  .hint { color: var(--muted); margin: 10px 2px; font-size: 12px; }
  .table-wrap {
    overflow-x: auto; background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px;
  }
  table { width: 100%; border-collapse: collapse; min-width: 760px; }
  th, td { padding: 8px 12px; text-align: left; white-space: nowrap; }
  th {
    font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: 0.06em;
    border-bottom: 1px solid var(--line); background: #0e141c;
  }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr.main td { border-top: 1px solid var(--line); }
  tbody:first-of-type tr.main td { border-top: 0; }
  td.name { color: #fff; font-weight: 600; }
  .delta-pos { color: var(--warn); }
  .delta-zero { color: var(--ok); }
  .dash { color: var(--muted); }
  .badge {
    display: inline-block; padding: 1px 8px; border-radius: 3px; font-size: 12px; font-weight: 700;
    border: 1px solid currentColor;
  }
  .badge.pending { color: var(--muted); }
  .badge.ok { color: var(--ok); background: rgba(34, 197, 94, 0.1); }
  .badge.warn { color: var(--warn); background: rgba(245, 158, 11, 0.1); }
  tbody.reconciled tr.main td:first-child { box-shadow: inset 3px 0 0 var(--ok); }
  tbody.failing tr td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
  tbody.failing tr.main td { background: rgba(245, 158, 11, 0.06); }
  tr.detail td {
    white-space: normal; background: rgba(245, 158, 11, 0.06); padding-top: 0;
  }
  .symptom { color: var(--warn); margin-bottom: 4px; }
  .symptom::before { content: "! "; font-weight: 700; }
  .log { color: var(--muted); margin-bottom: 6px; }
  .log::before { content: "log> "; color: var(--accent); }
  .still { color: var(--bad); font-weight: 700; margin-bottom: 6px; }
  .fixes { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
  button {
    font: inherit; font-size: 12px; cursor: pointer; color: #fff;
    background: #16222e; border: 1px solid #2b3b4d; border-radius: 4px; padding: 5px 10px;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.migrate { border-color: var(--accent); color: var(--accent); }
  .cost { color: var(--muted); font-size: 11px; }
  @media (max-width: 640px) {
    .app { padding: 10px; }
    table { min-width: 0; }
    thead { display: none; }
    tr.main { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; padding: 10px 12px 8px; }
    tbody tr.main td { border-top: 0; }
    tbody + tbody tr.main { border-top: 1px solid var(--line); }
    tr.main td { display: block; padding: 0; white-space: normal; }
    tr.main td::before {
      content: attr(data-label); display: block;
      font-size: 10px; color: var(--muted); letter-spacing: 0.06em;
    }
    tr.main td.name { grid-column: 1 / -1; font-size: 15px; }
    tr.main td.name::before { display: none; }
    td.num { text-align: left; }
    tr.detail, tr.detail td { display: block; }
    tr.detail td { padding: 0 12px 10px; }
    tbody.reconciled tr.main { box-shadow: inset 3px 0 0 var(--ok); }
    tbody.failing tr { box-shadow: inset 3px 0 0 var(--warn); }
    tbody.failing tr.main td, tr.detail td { background: none; }
    tbody.failing tr { background: rgba(245, 158, 11, 0.06); }
    tbody tr td:first-child { box-shadow: none !important; }
  }
  .overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75);
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .overlay.show { display: flex; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 22px; width: min(440px, 100%);
  }
  .card h2 { margin: 0 0 4px; font-size: 22px; }
  .card h2.win { color: var(--ok); }
  .card h2.lose { color: var(--bad); }
  .card .reason { color: var(--muted); margin: 0 0 14px; }
  .card dl { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; margin: 0 0 16px; }
  .card dt { color: var(--muted); }
  .card dd { margin: 0; text-align: right; color: #fff; font-weight: 700; font-variant-numeric: tabular-nums; }
  .card .again { color: var(--muted); font-size: 12px; margin: 0; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Teradata to Snowflake cutover</h1>
    <div class="meters" aria-live="polite">
      <div class="meter" id="acu-meter"><div class="label">ACUs left</div><div class="value" id="acus">20</div></div>
      <div class="meter" id="clock-meter"><div class="label">Days to Teradata renewal</div><div class="value" id="days">60</div></div>
    </div>
  </header>
  <p class="hint">Migrate costs 1 ACU. Each fix attempt costs 1 ACU. Reconcile all 8 tables before the renewal.</p>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>TABLE</th>
          <th class="num">TERADATA ROWS</th>
          <th class="num">SNOWFLAKE ROWS</th>
          <th class="num">DELTA</th>
          <th>STATUS</th>
          <th>ACTION</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="end-title">
  <div class="card">
    <h2 id="end-title"></h2>
    <p class="reason" id="end-reason"></p>
    <dl>
      <dt>Tables reconciled</dt><dd id="end-reconciled"></dd>
      <dt>ACUs spent</dt><dd id="end-spent"></dd>
      <dt>Wrong fixes</dt><dd id="end-wrong"></dd>
    </dl>
    <p class="again">Reload the page to play again.</p>
  </div>
</div>

<script>
const TABLES = [
  'EDW.CUSTOMER', 'EDW.ACCOUNT', 'EDW.ORDERS', 'EDW.INVOICE',
  'EDW.PAYMENT', 'EDW.CLAIM', 'EDW.INVENTORY', 'EDW.GL_ENTRY'
];
const STARTING_ACUS = 20;
const ROUND_SECONDS = 60;
const FAIL_RATE = 0.5;
const MIN_ROWS = 100000;
const MAX_ROWS = 5000000;

const ISSUES = [
  {
    id: 'set',
    symptom: 'Snowflake has more rows (+0.03%)',
    log: 'Teradata SET table silently dropped duplicate rows; Snowflake kept them',
    fix: 'Dedupe with QUALIFY ROW_NUMBER()',
    extraRows: true
  },
  {
    id: 'case',
    symptom: 'Counts match, but WHERE status = \'Active\' returns 0 rows in Snowflake vs 48,112 in Teradata',
    fix: 'Apply case-insensitive collation'
  },
  {
    id: 'char',
    symptom: 'Counts match, but JOIN on cust_code drops 12,904 rows; trailing spaces don\'t match',
    fix: 'RTRIM CHAR columns'
  },
  {
    id: 'decimal',
    symptom: 'Counts match, but SUM(amount) off by $1,284.17',
    fix: 'Map DECIMAL(18,2) to NUMBER(18,2), not FLOAT'
  },
  {
    id: 'tz',
    symptom: 'Counts match, but MAX(updated_at) shifted +5h',
    fix: 'Load as TIMESTAMP_NTZ in UTC'
  }
];

// Optional ?seed=N makes the round reproducible for testing.
const random = (() => {
  const seed = new URLSearchParams(location.search).get('seed');
  if (seed === null) return Math.random;
  let a = Number(seed) >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
})();

const randInt = (min, max) => min + Math.floor(random() * (max - min + 1));
const fmt = n => n.toLocaleString('en-US');

function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const state = {
  rows: TABLES.map(name => ({
    name,
    tdRows: randInt(MIN_ROWS, MAX_ROWS),
    sfRows: null,
    status: 'pending', // pending | reconciled | failing
    issue: null,
    options: [],
    wrongAttempt: false
  })),
  acus: STARTING_ACUS,
  spent: 0,
  wrongFixes: 0,
  seconds: ROUND_SECONDS,
  over: false,
  clock: null
};

const rowsEl = document.getElementById('rows');
const tableEl = rowsEl.parentElement;

function spendAcu() {
  state.acus -= 1;
  state.spent += 1;
}

function migrate(i) {
  const row = state.rows[i];
  if (state.over || row.status !== 'pending' || state.acus <= 0) return;
  spendAcu();
  if (random() < FAIL_RATE) {
    const issue = ISSUES[Math.floor(random() * ISSUES.length)];
    const others = shuffle(ISSUES.filter(x => x !== issue)).slice(0, 2);
    row.issue = issue;
    row.options = shuffle([issue, ...others]);
    row.status = 'failing';
    row.sfRows = issue.extraRows ? row.tdRows + Math.max(1, Math.round(row.tdRows * 0.0003)) : row.tdRows;
  } else {
    row.status = 'reconciled';
    row.sfRows = row.tdRows;
  }
  render();
  checkEnd();
}

function applyFix(i, optionIndex) {
  const row = state.rows[i];
  if (state.over || row.status !== 'failing' || state.acus <= 0) return;
  spendAcu();
  if (row.options[optionIndex] === row.issue) {
    row.status = 'reconciled';
    row.sfRows = row.tdRows;
    row.wrongAttempt = false;
  } else {
    row.wrongAttempt = true;
    state.wrongFixes += 1;
  }
  render();
  checkEnd();
}

function reconciledCount() {
  return state.rows.filter(r => r.status === 'reconciled').length;
}

function checkEnd() {
  if (state.over) return;
  if (reconciledCount() === TABLES.length) endGame(true, 'All 8 tables reconciled in Snowflake.');
  else if (state.seconds <= 0) endGame(false, 'Teradata renewal hit before every table reconciled.');
  else if (state.acus <= 0) endGame(false, 'Out of ACUs.');
}

function endGame(won, reason) {
  state.over = true;
  clearInterval(state.clock);
  render();
  const title = document.getElementById('end-title');
  title.textContent = won ? 'Cutover complete' : 'Cutover failed';
  title.className = won ? 'win' : 'lose';
  document.getElementById('end-reason').textContent = reason;
  document.getElementById('end-reconciled').textContent = `${reconciledCount()}/${TABLES.length}`;
  document.getElementById('end-spent').textContent = state.spent;
  document.getElementById('end-wrong').textContent = state.wrongFixes;
  document.getElementById('overlay').classList.add('show');
}

function tick() {
  if (state.over) return;
  state.seconds = Math.max(0, state.seconds - 1);
  render();
  checkEnd();
}

const COLUMNS = ['TABLE', 'TERADATA ROWS', 'SNOWFLAKE ROWS', 'DELTA', 'STATUS', 'ACTION'];

function cell(text, className) {
  const td = document.createElement('td');
  if (className) td.className = className;
  td.textContent = text;
  return td;
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function renderRow(row, i) {
  const body = el('tbody', row.status);
  const tr = el('tr', 'main');
  tr.appendChild(cell(row.name, 'name'));
  tr.appendChild(cell(fmt(row.tdRows), 'num'));

  if (row.sfRows === null) {
    tr.appendChild(cell('-', 'num dash'));
    tr.appendChild(cell('-', 'num dash'));
  } else {
    const delta = row.sfRows - row.tdRows;
    tr.appendChild(cell(fmt(row.sfRows), 'num'));
    tr.appendChild(cell(delta > 0 ? `+${fmt(delta)}` : '0', `num ${delta > 0 ? 'delta-pos' : 'delta-zero'}`));
  }

  const statusTd = document.createElement('td');
  const labels = { pending: ['Not migrated', 'pending'], reconciled: ['Reconciled', 'ok'], failing: ['Not reconciled', 'warn'] };
  const [label, badgeClass] = labels[row.status];
  statusTd.appendChild(el('span', `badge ${badgeClass}`, label));
  tr.appendChild(statusTd);

  const actionTd = document.createElement('td');
  if (row.status === 'pending') {
    const btn = el('button', 'migrate', 'Migrate');
    btn.type = 'button';
    btn.disabled = state.over || state.acus <= 0;
    btn.setAttribute('aria-label', `Migrate ${row.name} (1 ACU)`);
    btn.addEventListener('click', () => migrate(i));
    actionTd.appendChild(btn);
    actionTd.appendChild(el('span', 'cost', ' 1 ACU'));
  } else if (row.status === 'failing') {
    actionTd.appendChild(el('span', 'cost', 'Pick a fix below (1 ACU each)'));
  } else {
    actionTd.appendChild(el('span', 'dash', 'Done'));
  }
  tr.appendChild(actionTd);
  [...tr.children].forEach((td, k) => td.setAttribute('data-label', COLUMNS[k]));
  body.appendChild(tr);

  if (row.status === 'failing') {
    const detail = el('tr', 'detail');
    const td = document.createElement('td');
    td.colSpan = 6;
    td.appendChild(el('div', 'symptom', row.issue.symptom));
    if (row.issue.log) td.appendChild(el('div', 'log', row.issue.log));
    if (row.wrongAttempt) td.appendChild(el('div', 'still', 'Still not reconciled'));
    const fixes = el('div', 'fixes');
    row.options.forEach((option, k) => {
      const btn = el('button', 'fix', option.fix);
      btn.type = 'button';
      btn.disabled = state.over || state.acus <= 0;
      btn.addEventListener('click', () => applyFix(i, k));
      fixes.appendChild(btn);
    });
    td.appendChild(fixes);
    detail.appendChild(td);
    body.appendChild(detail);
  }
  return body;
}

function render() {
  tableEl.querySelectorAll('tbody').forEach(b => b.remove());
  state.rows.forEach((row, i) => tableEl.appendChild(renderRow(row, i)));
  document.getElementById('acus').textContent = state.acus;
  document.getElementById('days').textContent = state.seconds;
  document.getElementById('acu-meter').classList.toggle('low', state.acus <= 3);
  document.getElementById('clock-meter').classList.toggle('low', state.seconds <= 10);
}

render();
state.clock = setInterval(tick, 1000);
</script>
</body>
</html>
